    location /naming-tool-api/ {
        proxy_pass http://127.0.0.1:8099/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        auth_basic "Naming Tool";
        auth_basic_user_file /etc/nginx/.htpasswd_naming_tool;
    }

    location = /naming-tool {
        return 301 /naming-tool/;
    }

    location /naming-tool/ {
        alias /home/olive/naming-tool/frontend/;
        index index.html;
        try_files $uri $uri/ /naming-tool/index.html;
        auth_basic "Naming Tool";
        auth_basic_user_file /etc/nginx/.htpasswd_naming_tool;
    }

